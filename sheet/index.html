<style>
  html,body{margin:0;height:100%;font-family:"Noto Sans Lao","Leelawadee UI","Phetsarath OT","Saysettha OT",system-ui,sans-serif;font-size:13px;color:#222;background:#fff;}

  #top button{background:#fff;color:#201f1e;border:1px solid #c8c6c4;border-radius:2px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  #top button:hover{background:#f3f2f1;}
  #top button.pri{background:#107c41;border-color:#107c41;color:#fff;}

  #status.dirty{background:#fff4ce;color:#7a5b00;}

  #logList{flex:1;overflow:auto;padding:6px 8px;}
  .le{border-bottom:1px solid #e6e6e6;padding:6px 2px;line-height:1.45;}
  .le .who{font-weight:700;color:#185c37;}
  .le .tm{color:#777;font-size:11.5px;}
  .le .ref{display:inline-block;background:#e8f1ec;border-radius:3px;padding:0 5px;margin:0 3px;font-family:monospace;}
  .le .old{color:#b3261e;text-decoration:line-through;word-break:break-all;}
  .le .new{color:#0b6b2e;word-break:break-all;}
  .le .meta{color:#555;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:8px;padding:16px 18px;width:420px;max-width:94vw;max-height:88vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);}

  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap;}

  .modal button.pri{background:#217346;border-color:#217346;color:#fff;}
  .modal button.dng{background:#b3261e;border-color:#b3261e;color:#fff;}
  .bk{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:5px 0;font-size:12.5px;}
  .bk span{flex:1;}
  input[type=file]{display:none;}
/* ===== Excel-style ribbon (own HTML; Univer's built-in toolbar is hidden) ===== */
#ribbon{background:#fff;border-bottom:1px solid #d1d1d1;font-family:"Segoe UI","Noto Sans Lao","Leelawadee UI",system-ui,sans-serif;font-size:12px;color:#201f1e;user-select:none;flex:none;}
#rbTabs{display:flex;align-items:flex-end;gap:2px;padding:0 8px;background:#f3f2f1;border-bottom:1px solid #e1dfdd;height:28px;}
#rbTabs .tab{padding:5px 14px 6px;font-size:13px;cursor:pointer;border:1px solid transparent;border-bottom:none;color:#323130;background:none;font-family:inherit;}

.rpane{display:none;align-items:stretch;}
.rpane.on{display:flex;}

.rr{display:flex;align-items:center;gap:1px;}
.rb{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:3px;background:none;cursor:pointer;color:#201f1e;font-family:inherit;font-size:12px;padding:2px 5px;min-height:24px;box-sizing:border-box;white-space:nowrap;}
.rb:hover{background:#e9e8e7;border-color:#d6d6d6;}

.rb.big{flex-direction:column;justify-content:flex-start;gap:2px;padding:3px 7px;min-width:46px;min-height:62px;text-align:center;line-height:1.15;}

.fmRow{display:flex;align-items:center;gap:12px;padding:9px 8px;border-bottom:1px solid #edebe9;}

@media (max-width:700px){#fmNav{width:64px;}#fmNav button{font-size:0;padding:12px;justify-content:center;}#fmNav button i{font-size:18px;font-style:normal;}#fmMain{padding:14px;}.fmRow .acts{flex-direction:column;}}

<script>
"use strict";
/* ======================================================================
   Excel-like sheets for Marketing Studio (v8.64)
   - Univer (bundled, no CDN) for the grid. Data lives in Supabase (ms_sheets), reached ONLY through
     the ms_sheet_* RPC functions with the staff session token (x-ms-token). User name is taken from the
     token on the server, so the edit log cannot be forged.
   - Save = cell-level patch (only changed cells), debounced. No polling: other people's edits arrive through a
     Realtime broadcast PING (no data inside) -> we call ms_sheet_since. Also on window focus and the 🔄 button.
   ====================================================================== */
const SUPABASE_URL = "https://swrijpkkufarddsyqhrh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3cmlqcGtrdWZhcmRkc3lxaHJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MDQ4ODYsImV4cCI6MjA5ODQ4MDg4Nn0.GoGsR4Z4u4UiCJ03-jZkJAgjJtjD8J4MosiBh4cpths";
const TOKEN_KEY = "ms_token_v1";
const VQ = (location.search.match(/[?&]v=([^&]+)/) || [])[1] || String(Date.now());
const $ = id => document.getElementById(id);
const S = {                       // state
  me: null, files: [], sheet: null, boot: null, offCmd: null,
  version: 0, canEdit: true, baseline: null, dirty: false, saving: false, saveAgain: false,
  notes: [], timer: null, firstDirtyAt: 0, applyingRemote: false, channel: null, pullTimer: null, retry: 0, hostEl: null,
};

/* ---------- tiny helpers ---------- */
function token(){ try{ return localStorage.getItem(TOKEN_KEY) || ""; }catch(e){ return ""; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stable(o){
  if(o===null || typeof o!=="object") return JSON.stringify(o);
  if(Array.isArray(o)) return "["+o.map(stable).join(",")+"]";
  return "{"+Object.keys(o).sort().filter(k=>o[k]!==undefined).map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}";
}
function fmtTime(iso){
  try{
    const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Vientiane",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(iso));
    const g = t => (p.find(x=>x.type===t)||{}).value || "";
    return g("day")+"/"+g("month")+"/"+g("year")+" "+g("hour")+":"+g("minute");
  }catch(e){ return String(iso||""); }
}
function loadScript(src){
  return new Promise((res, rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); });
}
async function rpc(name, args, opts){
  const r = await fetch(SUPABASE_URL+"/rest/v1/rpc/"+name, Object.assign({
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":"Bearer "+SUPABASE_KEY, "x-ms-token":token() },
    body: JSON.stringify(args||{}),
  }, opts||{}));
  const txt = await r.text();
  let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){ const err = new Error((j && (j.message||j.hint)) || ("HTTP "+r.status)); err.status = r.status; throw err; }
  return j;
}
function setStatus(kind, text){ const el=$("status"); el.className = kind||""; el.textContent = text; }
function showMsg(html){ let m=$("msg"); if(!m){ m=document.createElement("div"); m.id="msg"; $("host").appendChild(m); } m.innerHTML = html; m.style.display="flex"; }
function hideMsg(){ const m=$("msg"); if(m) m.style.display="none"; }

/* small modals (prompt()/confirm() can be blocked inside some in-app browsers) */
function modal(html, onMount){
  return new Promise(resolve=>{
    const bg = document.createElement("div"); bg.className="modal-bg";
    bg.innerHTML = '<div class="modal">'+html+'</div>';
    document.body.appendChild(bg);
    const close = v => { bg.remove(); resolve(v); };
    bg.addEventListener("mousedown", e=>{ if(e.target===bg) close(null); });
    onMount(bg.querySelector(".modal"), close);
  });
}
function askText(title, def, okLabel){
  return modal('<h3>'+esc(title)+'</h3><input type="text" id="mi" value="'+esc(def||"")+'"><div class="row"><button id="mc">ຍົກເລີກ</button><button class="pri" id="mo">'+esc(okLabel||"ຕົກລົງ")+'</button></div>',
    (m, close)=>{ const i=m.querySelector("#mi"); setTimeout(()=>{i.focus();i.select();},30);
      m.querySelector("#mc").onclick=()=>close(null); m.querySelector("#mo").onclick=()=>close(i.value.trim()||null);
      i.addEventListener("keydown", e=>{ if(e.key==="Enter") close(i.value.trim()||null); if(e.key==="Escape") close(null); }); });
}
function askConfirm(text, okLabel, danger){
  return modal('<div style="line-height:1.5">'+esc(text)+'</div><div class="row"><button id="mc">ຍົກເລີກ</button><button class="'+(danger?"dng":"pri")+'" id="mo">'+esc(okLabel||"ຕົກລົງ")+'</button></div>',
    (m, close)=>{ m.querySelector("#mc").onclick=()=>close(false); m.querySelector("#mo").onclick=()=>close(true); });
}

/* ======================================================================
   Data model:  server "tabs" <-> Univer workbook snapshot
   tabs = { tabId: { meta:{name,order,rows,cols,colw:{c:px},rowh:{r:px},freeze:{xSplit,ySplit,startRow,startColumn},merges:[...],hcols:[],hrows:[]},
                     cells:{ "r,c": {v?,f?,t?,s?} } } }          (r,c are 0-based; s = inline style object)
   ====================================================================== */
const DEFAULT_ROWS = 1000, DEFAULT_COLS = 26;
const MIN_ROWS = 2000, MIN_COLS = 200;   // like Excel: grid keeps going past Z (AA, AB, ... up to GR) instead of ending in a blank gap

function buildWorkbook(row){
  const tabs = row.tabs || {};
  const styles = {}, styleIds = new Map(); let sc = 0;
  const sid = st => { const k=stable(st); let id=styleIds.get(k); if(!id){ id="st"+(++sc); styleIds.set(k,id); styles[id]=st; } return id; };
  let ids = Object.keys(tabs).sort((a,b)=>((tabs[a].meta||{}).order||0)-((tabs[b].meta||{}).order||0));
  const sheets = {};
  if(!ids.length){ ids=["t1"]; tabs.t1 = {meta:{name:"Sheet1",order:0,rows:DEFAULT_ROWS,cols:DEFAULT_COLS},cells:{}}; }
  ids.forEach((id, idx)=>{
    const meta = tabs[id].meta || {}, cells = tabs[id].cells || {};
    const cellData = {}; let maxR = 0, maxC = 0;
    for(const key in cells){
      const [r,c] = key.split(",").map(Number); const o = cells[key]; const cd = {};
      if(o.f!=null) cd.f = o.f;
      if(o.v!=null) cd.v = o.v;
      if(o.t!=null) cd.t = o.t;
      if(o.s) cd.s = sid(o.s);
      (cellData[r] = cellData[r] || {})[c] = cd;
      if(r>maxR) maxR=r; if(c>maxC) maxC=c;
    }
    const colLimit = Math.max(meta.cols||DEFAULT_COLS, MIN_COLS, maxC+5);   // v8.69: files imported earlier stored 16384 column widths (slow saves) -> ignore those beyond the sheet
    const columnData = {}; for(const c in (meta.colw||{})) if(Number(c) < colLimit) columnData[c] = {w: meta.colw[c]};
    (meta.hcols||[]).forEach(c=>{ (columnData[c] = columnData[c] || {}).hd = 1; });
    const rowData = {}; for(const r in (meta.rowh||{})) rowData[r] = {h: meta.rowh[r], ia: 0};

  const mine = {}; for(const id in patch.tabs){ const t=patch.tabs[id]; if(t.cells) for(const k in t.cells) mine[id+"|"+k]=1; }
  try{
    let res = null;
    let first = true, base = before;
    for(const part of chunkPatch(patch, 3000)){
      // base = the server version this grid is built on; the server refuses the patch if someone changed the structure after it
      res = await rpc("ms_sheet_apply", {p_id: sheetId, p_patch: first && notes.length ? {tabs: part.tabs, notes, base} : {tabs: part.tabs, base}}, keepalive ? {keepalive:true} : null);
      if(res && res.conflict) break;
      base = res.version; first = false;
    }
    if(!S.sheet || S.sheet.id !== sheetId) { S.saving=false; return true; }
    if(res && res.conflict){ onConflict(sheetId, patch, before, notes, chunkPatch(patch,3000).length, cur, notesOver); return false; }
    S.baseline = cur; S.version = res.version; S.retry = 0;
    S.dirty = false; S.saving = false;
    setStatus("","✓ ບັນທຶກແລ້ວ "+nowTxt());
    pingOthers();
    if(res.version !== before + 1 + (chunkPatch(patch,3000).length-1)){ pullRemote(mine, before); } // somebody else saved in between
    if(S.saveAgain){ S.saveAgain=false; markDirty(); }
    return true;
  }catch(e){
    S.saving = false; console.error("save failed", e); S.notes = notes.concat(S.notes).slice(0,60); if(notesOver) S.notesOver = true;
    if(/read only/i.test(e.message||"")){ setStatus("bad","🔒 ໄຟລ໌ນີ້ເບິ່ງໄດ້ຢ່າງດຽວ"); S.canEdit=false; try{ S.boot.univerAPI.getActiveWorkbook().setEditable(false); }catch(_){} return false; }
    setStatus("bad","⚠ ບັນທຶກບໍ່ສຳເລັດ"+(S.retry<6 ? " — ກຳລັງລອງໃໝ່ ຢ່າປິດໜ້ານີ້" : " — ກົດ 💾 ບັນທຶກ"));
    if(S.retry++ < 6){ clearTimeout(S.timer); S.timer = setTimeout(()=>save(false), Math.min(30000, 4000*S.retry)); }
    return false;
  }
}

function toCellData(o){
  if(!o) return null;
  const cd = {};
  if(o.f!=null){ cd.f = o.f; cd.v = null; } else { cd.f = null; cd.v = o.v==null ? null : o.v; }
  cd.t = o.t==null ? null : o.t;
  cd.s = o.s ? o.s : null;

}

// Move cell coordinates through other people's row/column inserts and deletes (ops are in the order they happened).
function xformCells(cells, ops){
  const out = {}; let dropped = 0;
  for(const k in cells){
    const rc = k.split(",").map(Number); let r = rc[0], c = rc[1], alive = true;
    for(const o of ops){
      if(o.k==="rr"){ if(r>=o.a+o.n) r-=o.n; else if(r>=o.a){ alive=false; break; } }
      else if(o.k==="ir"){ if(r>=o.a) r+=o.n; }
      else if(o.k==="rc"){ if(c>=o.a+o.n) c-=o.n; else if(c>=o.a){ alive=false; break; } }
      else if(o.k==="ic"){ if(c>=o.a) c+=o.n; }
    }
    if(alive) out[r+","+c] = cells[k]; else dropped++;
  }
  return {out, dropped};
}
// Put the re-mapped edits on the freshly loaded grid; the normal autosave then stores them.
async function applyRebase(rb){
  try{
    const api = S.boot.univerAPI, wb = api.getActiveWorkbook(), unitId = wb.getId(), sheetId = S.sheet && S.sheet.id;
    if(rb.ops && rb.ops.length){
      // the grid we merged against must still be the latest one: no other row/column change may have slipped in since
      const chk = await rpc("ms_sheet_ops_since", {p_id: sheetId, p_since: rb.ver});
      if(!S.sheet || S.sheet.id!==sheetId) return;
      if(!chk || !chk.safe || (chk.ops||[]).length){
        warnBar(["ມີຄົນອື່ນປ່ຽນແຖວ/ຖັນ ຊ້ຳອີກຄັ້ງ","ການລຶບ/ເພີ່ມແຖວຂອງທ່ານຍັງບໍ່ໄດ້ບັນທຶກ. ກະລຸນາເບິ່ງຕາຕະລາງ ແລ້ວເຮັດຄືນ."]);
        return;
      }
      // replay our row/column operations on the latest grid (Univer re-points the formulas itself; they are recorded in the history as ours)
      for(const o of rb.ops){
        if(!(o.n>0)) continue;
        const ws = wb.getSheetBySheetId(o.tab); if(!ws) continue;
        if(o.k==="rr") ws.deleteRows(o.a, o.n); else if(o.k==="ir") ws.insertRows(o.a, o.n);
        else if(o.k==="rc") ws.deleteColumns(o.a, o.n); else if(o.k==="ic") ws.insertColumns(o.a, o.n);
      }
    }
    for(const tab in rb.tabs){
      if(!wb.getSheetBySheetId(tab)) continue;
      const cellValue = {};
      for(const k in rb.tabs[tab]){ const rc = k.split(",").map(Number); (cellValue[rc[0]] = cellValue[rc[0]] || {})[rc[1]] = rb.tabs[tab][k] ? toCellData(rb.tabs[tab][k]) : null; }
      api.syncExecuteCommand("sheet.mutation.set-range-values", {unitId, subUnitId: tab, cellValue});
    }
    markDirty();
  }catch(e){ console.error("rebase failed", e); warnBar(["⚠ ຍ້າຍຂໍ້ມູນທີ່ທ່ານແກ້ບໍ່ສຳເລັດ","ກະລຸນາກວດຕາຕະລາງ ແລ້ວເຮັດຄືນສິ່ງທີ່ທ່ານແກ້ຄັ້ງສຸດທ້າຍ."]); }
}
// Server refused our save because someone else changed the structure (insert/delete row or column...) after our grid was loaded.
// If every such change is a known row/column insert/delete, our pending cell edits are re-mapped onto the new layout automatically.
async function onConflict(sheetId, patch, base, notes, chunks, cur, notesOver){
  S.saving = false; S.conflict = true; S.dirty = false; clearTimeout(S.timer); S.notes = [];
  setStatus("bad","⚠ ມີຄົນອື່ນປ່ຽນແຖວ/ຖັນ — ກຳລັງໂຫຼດໃໝ່");
  // WHO did WHAT (latest structural line of the file history made by somebody else)
  let who = "";
  try{
    const log = await rpc("ms_sheet_log", {p_id: sheetId, p_limit: 12});
    const me = S.me && S.me.name;
    const x = (log||[]).find(r=>(r.kind==="meta"||r.kind==="bulk") && r.user_name!==me && r.new_text && !/ຫຼາຍຊ່ອງພ້ອມກັນ/.test(r.new_text)) || (log||[]).find(r=>(r.kind==="meta"||r.kind==="bulk") && r.user_name!==me);
    if(x) who = x.user_name+" — "+String(x.new_text||"ປ່ຽນໂຄງສ້າງຕາຕະລາງ").split(" — ")[0].slice(0,80);
  }catch(e){ console.error(e); }
  // try to keep the user's edits (and our own row/column inserts/deletes: Excel-365-style merge)
  let kept = null, dropped = 0, merged = false;
  try{
    const onlyCells = !notes.length && chunks===1 && Object.keys(patch.tabs).every(id=>{ const t=patch.tabs[id]; return t && t.cells && !t.del && !t.meta; });
    const opsOnly = notes.length>0 && !notesOver && cur && notes.every(n=>n.op && /^(rr|ir|rc|ic)$/.test(n.op.k) && n.op.n>0 && S.baseline[n.sub]);
    if(onlyCells || opsOnly){
      const r = await rpc("ms_sheet_ops_since", {p_id: sheetId, p_since: base});
      if(r && r.safe){
        let theirs = (r.ops||[]).map(o=>({tab:o.tab,k:o.k,a:o.a,n:o.n})), ours2 = [], cellPatch = onlyCells ? patch : null;
        if(opsOnly){
          const rb = rebaseOps(notes.map(n=>({tab:n.sub,k:n.op.k,a:n.op.a,n:n.op.n})), theirs);
          if(rb){
            const p2 = makePatch(shiftBaseline(S.baseline, notes), cur);   // only the real edits, not the cells that slid because of our own delete
            if(!p2 || (p2.n <= 200 && Object.keys(p2.tabs).every(id=>S.baseline[id] && !p2.tabs[id].del))){ cellPatch = p2 || {tabs:{}}; ours2 = rb.ours2; theirs = rb.theirs2; merged = true; }
          }
        }
        if(cellPatch){
          kept = {tabs:{}, ops: ours2.filter(o=>o.n>0), ver: r.version}; let n = 0;
          for(const id in cellPatch.tabs){
            if(!cellPatch.tabs[id].cells) continue;
            const x = xformCells(cellPatch.tabs[id].cells, theirs.filter(o=>o.tab===id));
            dropped += x.dropped; if(Object.keys(x.out).length){ kept.tabs[id] = x.out; n += Object.keys(x.out).length; }
          }
          if(!n && !kept.ops.length && !merged) kept = null;
        }
      }
    }
  }catch(e){ console.error("rebase check failed", e); kept = null; }
  if(kept){
    S.rebase = kept;
    const lines = ["ມີຄົນອື່ນລຶບ/ເພີ່ມແຖວ ຫຼື ຖັນ ໃນຂະນະທີ່ທ່ານກຳລັງແກ້"];
    if(who) lines.push("ເຮັດໂດຍ: "+who);
    lines.push(merged ? "ລະບົບລວມການລຶບ/ເພີ່ມແຖວ ຫຼື ຖັນ ຂອງທ່ານ ກັບຂອງຄົນອື່ນໃຫ້ແລ້ວ ແລະ ກຳລັງບັນທຶກ — ບໍ່ຕ້ອງເຮັດຫຍັງ." : "ລະບົບຍ້າຍສິ່ງທີ່ທ່ານແກ້ ໄປໃສ່ຕຳແໜ່ງທີ່ຖືກຕ້ອງໃຫ້ແລ້ວ ແລະ ກຳລັງບັນທຶກ — ບໍ່ຕ້ອງເຮັດຫຍັງ.");
    if(dropped) lines.push("ມີ "+dropped+" ຊ່ອງຢູ່ໃນແຖວ/ຖັນທີ່ຖືກລຶບໄປແລ້ວ ຈຶ່ງບໍ່ໄດ້ບັນທຶກ.");
    warnBar(lines, true);
  } else {
    const lines = ["ມີຄົນອື່ນລຶບ/ເພີ່ມແຖວ ຫຼື ຖັນ ໃນຂະນະທີ່ທ່ານກຳລັງແກ້"];
    if(who) lines.push("ເຮັດໂດຍ: "+who);
    lines.push("ສິ່ງທີ່ທ່ານແກ້ຄັ້ງສຸດທ້າຍ ບໍ່ໄດ້ຖືກບັນທຶກ. ໜ້າຈໍໂຫຼດຂໍ້ມູນຫຼ້າສຸດໃຫ້ແລ້ວ.");
    lines.push("ສິ່ງທີ່ຕ້ອງເຮັດ: ເບິ່ງຕາຕະລາງກ່ອນ ແລ້ວພິມຄືນສະເພາະສ່ວນທີ່ຍັງຂາດ. ຖ້າແຖວທີ່ທ່ານຢາກລຶບຖືກລຶບແລ້ວ ບໍ່ຕ້ອງລຶບອີກ.");
    warnBar(lines);
  }

}
async function pullRemote(skipKeys, sinceOverride){
  if(!S.sheet) return;
  clearTimeout(S.pullTimer);
  if(S.dirty || S.saving){ await save(false); }
  const sheetId = S.sheet.id; const since = sinceOverride!=null ? sinceOverride : S.version;
  let res;
  try{ res = await rpc("ms_sheet_since", {p_id: sheetId, p_since: since}); }catch(e){ console.error(e); return; }
  if(!S.sheet || S.sheet.id!==sheetId) return;
  if(res.full){
    // never swap the grid under someone who is dragging or typing: try again in a moment (pullRemote saves their edit first)
    if(userBusy()){ S.pullTimer = setTimeout(()=>pullRemote(), 1000); return; }
    await openSheet(sheetId, true, true); return;
  }
  if(res.version > S.version) S.version = res.version;
  const ch = (res.changes||[]).filter(c=>!(skipKeys && skipKeys[c.tab+"|"+c.key]));
  if(!ch.length) return;
  const api = S.boot.univerAPI, wb = api.getActiveWorkbook(), unitId = wb.getId();
  const byTab = {};
  ch.forEach(c=>{ const [r,k] = c.key.split(",").map(Number); ((byTab[c.tab] = byTab[c.tab] || {})[r] = (byTab[c.tab][r] || {}))[k] = c.cell; });
  S.applyingRemote = true;
  try{
    for(const tab in byTab){
      if(!wb.getSheetBySheetId(tab)) continue;
      const cellValue = {};
      for(const r in byTab[tab]){ cellValue[r] = {}; for(const k in byTab[tab][r]){ const o = byTab[tab][r][k]; cellValue[r][k] = o ? toCellData(o) : null; } }
      api.syncExecuteCommand("sheet.mutation.set-range-values", {unitId, subUnitId: tab, cellValue});
    }
  }catch(e){ console.error("apply remote failed", e); S.applyingRemote=false; await openSheet(sheetId, true, true); return; }
  // refresh baseline for those cells from what Univer actually holds now (avoids echo edits)
  setTimeout(()=>{
    try{
      const now = extract(snapshot(), false);
      for(const tab in byTab){ if(!now[tab]||!S.baseline[tab]) continue;
        for(const r in byTab[tab]) for(const k in byTab[tab][r]){ const key=r+","+k;
          if(now[tab].cells[key]) S.baseline[tab].cells[key]=now[tab].cells[key]; else delete S.baseline[tab].cells[key]; } }
    }catch(e){ console.error(e); }
    S.applyingRemote = false;
    const who = [...new Set(ch.map(c=>c.by).filter(Boolean))].join(", ");
    if(who) setStatus("", "🔄 ອັບເດດຈາກ "+who);
  }, 350);
}
function schedulePull(){ clearTimeout(S.pullTimer); S.pullTimer = setTimeout(()=>pullRemote(), 500); }

/* realtime: broadcast PING (no data) + presence names. Uses the parent app's supabase client when available. */
function connectChannel(){
  disconnectChannel();
  let sb = null; try{ sb = window.parent && window.parent !== window ? window.parent.sb : null; }catch(e){}
  if(!sb || !S.sheet || !S.me) return;
  try{
    const ch = sb.channel("ms-sheet:"+S.sheet.id, {config:{broadcast:{self:false}, presence:{key: String(S.me.id)+"-"+Math.random().toString(36).slice(2,7)}}});
    ch.on("broadcast", {event:"changed"}, ()=>schedulePull());
    ch.on("presence", {event:"sync"}, ()=>{
      const st = ch.presenceState(); const names = [];
      Object.keys(st).forEach(k=>(st[k]||[]).forEach(p=>{ if(p && p.name) names.push(p.name); }));
      const uniq = [...new Set(names)];
      $("presence").textContent = uniq.length>1 ? ("👥 ກຳລັງເປີດຢູ່: "+uniq.join(", ")) : "";
    });
    ch.subscribe(status=>{ if(status==="SUBSCRIBED"){ try{ ch.track({name:S.me.name}); }catch(e){} } });
    S.channel = {ch, sb};
  }catch(e){ console.error("realtime", e); }
}
function disconnectChannel(){
  if(S.channel){ try{ S.channel.sb.removeChannel(S.channel.ch); }catch(e){} S.channel = null; }
  $("presence").textContent = "";
}

/* --- helpers --- */
function toast(msg){ let t=$("rbToast"); if(!t){ t=document.createElement("div"); t.id="rbToast"; t.style.cssText="position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:#323130;color:#fff;padding:8px 16px;border-radius:4px;font-size:13px;z-index:300;max-width:90vw;"; document.body.appendChild(t); } t.textContent=msg; t.style.display="block"; clearTimeout(t._t); t._t=setTimeout(()=>{ t.style.display="none"; },2800); }
function wbk(){ try{ return S.boot && S.boot.univerAPI.getActiveWorkbook(); }catch(e){ return null; } }
function colName(c){ let s=""; c=c+1; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function edit(fn){
  if(!S.boot || !S.canEdit) return;

  if(!r){ toast("ເລືອກຊ່ອງກ່ອນ"); return; }
  try{ fn(r, wb.getActiveSheet(), wb); }catch(e){ console.error(e); toast("⚠ "+(e.message||e)); }
  rbRefreshSoon();
}

function openMenu(anchor, items){
  closeMenu();
  const m=document.createElement("div"); m.className="rmenu";
  m.innerHTML = items.map((it,i)=> it==="-" ? '<div class="ms"></div>' : '<div class="mi" data-i="'+i+'">'+esc(it[0])+'</div>').join("");

  const a=anchor.getBoundingClientRect(); m.style.left=Math.min(a.left, window.innerWidth-m.offsetWidth-6)+"px"; m.style.top=(a.bottom+1)+"px";

function openPalette(anchor, kind){

function applyColor(kind, c){
  edit(r=>{
    if(kind==="fill"){ if(c==="none") r.setBackground(null); else { RB.fillColor=c; r.setBackground(c); } }
    else { const v = c==="none" ? "#000000" : c; if(c!=="none") RB.fontColor=c; r.setFontColor(v); }
  });
  rbPaintBars();
}
function rbPaintBars(){ /* coloured bar under Fill / Font Color icons */
  const f=document.querySelector('[data-act="fillApply"]'), t=document.querySelector('[data-act="fcolApply"]');
  if(f) f.style.boxShadow="inset 0 -3px 0 "+RB.fillColor; if(t) t.style.boxShadow="inset 0 -3px 0 "+RB.fontColor;
}
function setNum(p){ edit(r=>r.setNumberFormat(p)); }
function bumpDec(d){
  edit(r=>{
    let p = ""; try{ p = r.getNumberFormat() || ""; }catch(e){}
    if(!p || p==="General" || p==="@"){ if(d>0) r.setNumberFormat("0.0"); return; }
    const parts = p.split(";").map(s=>{
      const m = s.match(/\.(0+)/);
      if(m){ const n=m[1].length+d; return n<=0 ? s.replace(/\.0+/,"") : s.replace(/\.0+/,"."+"0".repeat(n)); }
      if(d>0){ const i=Math.max(s.lastIndexOf("0"), s.lastIndexOf("#")); if(i>=0) return s.slice(0,i+1)+".0"+s.slice(i+1); }
      return s;
    });
    r.setNumberFormat(parts.join(";"));
  });
}
function selInfo(r){ return {r0:r.getRow(), r1:r.getLastRow(), c0:r.getColumn(), c1:r.getLastColumn()}; }
function autoFn(fn){
  edit((r, ws)=>{
    const s=selInfo(r), isNum=(v)=>typeof v==="number" && isFinite(v);
    const val=(row,col)=>{ try{ return ws.getRange(row,col).getRawValue(); }catch(e){ return null; } };
    const put=(row,col,f)=>{ ws.getRange(row,col).setFormula(f); };
    if(s.r0===s.r1 && s.c0===s.c1){
      let t=s.r0-1; while(t>=0 && isNum(val(t,s.c0))) t--;
      if(t < s.r0-1){ put(s.r0,s.c0,"="+fn+"("+colName(s.c0)+(t+2)+":"+colName(s.c0)+s.r0+")"); return; }
      let l=s.c0-1; while(l>=0 && isNum(val(s.r0,l))) l--;
      if(l < s.c0-1){ put(s.r0,s.c0,"="+fn+"("+colName(l+1)+(s.r0+1)+":"+colName(s.c0-1)+(s.r0+1)+")"); return; }
      toast("ບໍ່ພົບຕົວເລກ ໃຫ້ເລືອກຊ່ວງຕົວເລກກ່ອນ"); return;
    }
    if(s.r0===s.r1){ put(s.r0, s.c1+1, "="+fn+"("+colName(s.c0)+(s.r0+1)+":"+colName(s.c1)+(s.r0+1)+")"); return; }
    for(let c=s.c0;c<=s.c1;c++) put(s.r1+1, c, "="+fn+"("+colName(c)+(s.r0+1)+":"+colName(c)+(s.r1+1)+")");
  });
}
function sortSel(asc){
  edit((r, ws)=>{
    let rg=r, s=selInfo(r);
    const activeCol = (()=>{ try{ return wbk().getActiveCell().getColumn(); }catch(e){ return s.c0; } })();
    if(s.r0===s.r1 && s.c0===s.c1){ try{ rg=r.getDataRegion(); s=selInfo(rg); }catch(e){} }
    let first=s.r0;
    if(s.r1>s.r0 && r.getRow()===r.getLastRow() && r.getColumn()===r.getLastColumn()){ // single cell -> auto-detect header row
      let allText=true; for(let c=s.c0;c<=s.c1;c++){ const v=ws.getRange(s.r0,c).getRawValue(); if(typeof v!=="string" || v==="") allText=false; }
      if(allText) first=s.r0+1;
    }
    const target = ws.getRange(first, s.c0, s.r1-first+1, s.c1-s.c0+1);
    target.sort({column: Math.max(0, activeCol - s.c0), ascending: !!asc});
  });
}
function rowsCols(r){ const s=selInfo(r); return {r0:s.r0, nr:s.r1-s.r0+1, c0:s.c0, nc:s.c1-s.c0+1}; }

function rbRefresh(){

  on("bold", s.bl===1); on("italic", s.it===1); on("underline", s.ul && s.ul.s===1); on("strike", s.st && s.st.s===1); on("wrap", s.tb===3);
  on("hleft", s.ht===1); on("hcenter", s.ht===2); on("hright", s.ht===3); on("vtop", s.vt===1); on("vmid", s.vt===2); on("vbot", s.vt===3);
  try{ on("mergeMenu", r.isMerged()); }catch(e){}
  const fs=$("rbFont"); if(fs && document.activeElement!==fs){ const f=s.ff||"Saysettha OT"; if(![...fs.options].some(o=>o.value===f)){ const o=document.createElement("option"); o.textContent=f; fs.appendChild(o); } fs.value=f; }
  const sz=$("rbSize"); if(sz && document.activeElement!==sz) sz.value = s.fs || 11;
  const ns=$("rbNum"); if(ns){ let p="General"; try{ p=r.getNumberFormat()||"General"; }catch(e){} const i=NUMFMT.findIndex(n=>n[1]===p); ns.value = String(i); if(i<0) ns.value="-1"; }
}

// soft=true: someone else changed the structure (insert/delete row, width...). Rebuild the grid in the background and swap it in
// without the loading screen, keeping the same sheet tab, selected cell and scroll position, so it feels like an in-place update.
async function openSheet(id, keepActiveTab, soft){
  soft = !!(soft && S.boot && S.sheet && S.sheet.id===id);
  if(!soft) showMsg('<div class="spin"></div><div>ກຳລັງເປີດໄຟລ໌...</div>');
  let row;
  try{ await ensureUniver(); row = await rpc("ms_sheet_get", {p_id:id}); }
  catch(e){ console.error(e); if(soft){ S.conflict=false; setStatus("bad","⚠ ອັບເດດບໍ່ໄດ້: "+e.message); return; } showMsg('<div>⚠ ເປີດໄຟລ໌ບໍ່ໄດ້: '+esc(e.message)+'</div>'); return; }
  if(soft && S.sheet.id!==id) return;
  let activeId = null, keepSel = null, keepScroll = null;
  if(keepActiveTab && S.boot){ try{ activeId = S.boot.univerAPI.getActiveWorkbook().getActiveSheet().getSheetId(); }catch(e){} }
  if(soft){
    try{ const sh = S.boot.univerAPI.getActiveWorkbook().getActiveSheet(); const rg = sh.getSelection && sh.getSelection() && sh.getSelection().getActiveRange(); if(rg) keepSel = rg.getA1Notation(); }catch(e){}
    try{ const sh = S.boot.univerAPI.getActiveWorkbook().getActiveSheet(); keepScroll = sh.getScrollState(); }catch(e){}
  }
  clearTimeout(S.timer); S.dirty=false; S.saving=false; S.saveAgain=false; S.retry=0; S.conflict=false; S.loading=true;
  let old = null;
  if(soft){ old = {boot:S.boot, off:S.offCmd, el:S.hostEl}; S.boot=null; S.offCmd=null; S.hostEl=null; }
  else { destroyBoot(); disconnectChannel(); }
  S.sheet = row; S.version = row.version; S.canEdit = !!row.can_edit; S.me = row.me;
  try{ localStorage.setItem("ms_sheet_last_"+row.me.id, row.id); }catch(e){}
  const host = document.createElement("div"); host.className = "univer-host-inner"; $("host").appendChild(host); S.hostEl = host;
  if(old) host.style.visibility = "hidden";      // old grid stays on screen until the new one is ready
  const data = buildWorkbook(row);
  if(activeId && data.sheets[activeId]) data.sheetOrder = data.sheetOrder; // order kept; active tab restored below
  S.boot = window.UniverBoot(host, data);
  try{ S.boot.univerAPI.setUIVisible("toolbar", false); }catch(e){ console.error(e); }   // our own Excel-style ribbon replaces Univer's
  { const rb=$("ribbon"); rb.style.display=""; rb.classList.toggle("ro", !S.canEdit); }
  S.offCmd = S.boot.onCommand((cid, params)=>{
    rbRefreshSoon();
    if(cid && cid.indexOf("sheet.mutation.")===0) noteStruct(cid, params);
    if(!cid || cid.indexOf("sheet.mutation.")!==0) return;
    if(/active|scroll|zoom|selection|activate/.test(cid)) return;
    markDirty();
  });
  if(!S.canEdit){ try{ S.boot.univerAPI.getActiveWorkbook().setEditable(false); }catch(e){} }
  if(activeId){ try{ const wb=S.boot.univerAPI.getActiveWorkbook(); const sh=wb.getSheetBySheetId(activeId); if(sh) wb.setActiveSheet(sh); }catch(e){} }
  if(!soft) hideMsg();
  await new Promise(r=>setTimeout(r,400));                 // let Univer finish its first load
  if(old){
    try{
      const wb = S.boot.univerAPI.getActiveWorkbook(), sh = wb.getActiveSheet();
      if(keepSel){ try{ sh.getRange(keepSel).activate(); }catch(e){} }
      if(keepScroll){ try{ sh.scrollToCell(keepScroll.sheetViewStartRow||0, keepScroll.sheetViewStartColumn||0); }catch(e){} }
    }catch(e){ console.error(e); }
    await new Promise(r=>setTimeout(r,120));
    host.style.visibility = "";                             // swap: show the new grid, then drop the old one
    try{ old.off && old.off(); }catch(e){}
    try{ old.boot && old.boot.dispose(); }catch(e){}
    try{ old.el && old.el.remove(); }catch(e){}
  }
  S.baseline = extract(snapshot(), false);
  S.loading = false; S.dirty = false; clearTimeout(S.timer);
  if(S.rebase){ const rb = S.rebase; S.rebase = null; applyRebase(rb); }
  // a brand-new/empty file: make the default tab exist on the server too
  if(!Object.keys(row.tabs||{}).length && S.canEdit) markDirty();
  setStatus("", S.canEdit ? "✓ ບັນທຶກແລ້ວ" : "🔒 ເບິ່ງໄດ້ຢ່າງດຽວ");
  ["btnExport","btnPull","btnLog","btnSave"].forEach(b=>$(b).disabled=false);
  const setBtn = $("btnSet"); setBtn.style.display = (S.me && S.me.role==="owner") ? "" : "none"; setBtn.disabled = false;
  $("fileSel").value = row.id;
  if(!soft || !S.channel) connectChannel();
  if(soft) setStatus("", "🔄 ອັບເດດຈາກບັນຊີອື່ນ");
}

/* ---- per-file account access (v8.71): creator/owner chooses which accounts may open / edit a file ---- */
async function openAccess(id, name){
  let info; try{ info = await rpc("ms_sheet_access_get", {p_id:id}); }catch(e){ alert("ເປີດບໍ່ໄດ້: "+e.message); return false; }
  const users = (info.users||[]);

    }

    if(act==="trash" && f){ await fmTrash([id], f.name); return; }

let exceljsReady = null;

const THEME = ["FFFFFF","000000","E7E6E6","44546A","4472C4","ED7D31","A5A5A5","FFC000","5B9BD5","70AD47"];
function tint(hex, t){
  let r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  const f = x => t<0 ? Math.round(x*(1+t)) : Math.round(x+(255-x)*t);
  r=f(r); g=f(g); b=f(b);
  return [r,g,b].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function colorOf(c){

  if(c.theme!=null && THEME[c.theme]){ return "#"+(c.tint ? tint(THEME[c.theme], c.tint) : THEME[c.theme]); }
  return null;
}
const BSTYLE = {thin:1,hair:2,dotted:3,dashed:4,dashDot:5,dashDotDot:6,double:7,medium:8,mediumDashed:9,mediumDashDot:10,mediumDashDotDot:11,slantDashDot:12,thick:13};

function xlStyleToUniver(cell){
  const s = {};

  if(f.size) s.fs = f.size; if(f.name) s.ff = f.name;
  const fc = colorOf(f.color); if(fc && fc!=="#000000") s.cl = {rgb: fc};
  const fl = cell.fill; if(fl && fl.type==="pattern" && fl.pattern==="solid"){ const bc = colorOf(fl.fgColor); if(bc && bc!=="#FFFFFF") s.bg = {rgb: bc}; }
  const al = cell.alignment || {};
  if(al.horizontal){ const h = {left:1,center:2,right:3,centerContinuous:2}[al.horizontal]; if(h) s.ht = h; }
  if(al.vertical){ const v = {top:1,middle:2,center:2,bottom:3}[al.vertical]; if(v) s.vt = v; }
  if(al.wrapText) s.tb = 3;
  const bd = cell.border;
  if(bd){ const b = {}; [["top","t"],["bottom","b"],["left","l"],["right","r"]].forEach(([k,u])=>{ const e = bd[k]; if(e && e.style){ b[u] = {s: BSTYLE[e.style]||1, cl:{rgb: colorOf(e.color)||"#000000"}}; } }); if(Object.keys(b).length) s.bd = b; }
  const nf = cell.numFmt; if(nf && nf!=="General") s.n = {pattern: nf};

}
function excelDateToSerial(d){ return d.getTime()/86400000 + 25569; }
function cellValueOf(cell){
  const v = cell.value; if(v===null || v===undefined) return null;
  if(v instanceof Date) return {v: excelDateToSerial(v), dateFmt:true};
  if(typeof v==="object"){
    if(v.formula || v.sharedFormula){
      let f = cell.formula || v.formula; if(!f) return null;
      const res = v.result; const o = {f:"="+f};
      return o;
    }
    if(v.richText) return {v: v.richText.map(t=>t.text).join("")};
    if(v.hyperlink) return {v: v.text!=null ? (typeof v.text==="object" && v.text.richText ? v.text.richText.map(t=>t.text).join("") : String(v.text)) : v.hyperlink};
    if(v.error) return {v: String(v.error)};
    if(v.text!=null) return {v:String(v.text)};
    return null;
  }

}
async function xlsxToTabs(file){
  const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
  const tabs = {}; let idx = 0;
  wb.eachSheet(ws=>{
    const id = "t"+Date.now().toString(36)+(idx+1);
    const cells = {};
    ws.eachRow({includeEmpty:true}, (row, rn)=>{
      row.eachCell({includeEmpty:true}, (cell, cn)=>{
        const cv = cellValueOf(cell); const st = xlStyleToUniver(cell);
        if(!cv && !st) return;
        const o = cv ? {} : {};
        if(cv){ if(cv.f!=null) o.f = cv.f; if(cv.v!=null) o.v = cv.v; if(cv.t!=null) o.t = cv.t; }
        if(st){ o.s = st; if(cv && cv.dateFmt && !st.n) o.s = Object.assign({n:{pattern:"yyyy-mm-dd"}}, st); }
        else if(cv && cv.dateFmt){ o.s = {n:{pattern:"yyyy-mm-dd"}}; }
        if(Object.keys(o).length) cells[(rn-1)+","+(cn-1)] = o;
      });
    });
    let usedC = 0; for(const k in cells){ const cc = Number(k.split(",")[1]); if(cc>usedC) usedC=cc; }
    const meta = { name: ws.name, order: idx, rows: Math.max(ws.rowCount+200, DEFAULT_ROWS), cols: Math.max(usedC+30, DEFAULT_COLS) };   // v8.69: not ws.columnCount (16384 when the xlsx defines every column)
    const colw = {}; (ws.columns||[]).forEach((c,i)=>{ if(i >= meta.cols) return; if(c && c.width) colw[i] = Math.round(c.width*7+5); if(c && c.hidden){ (meta.hcols = meta.hcols||[]).push(i); } });
    if(Object.keys(colw).length) meta.colw = colw;
    const rowh = {}; ws.eachRow({includeEmpty:false},(row,rn)=>{ if(row.height && row.customHeight!==false) rowh[rn-1] = Math.round(row.height*4/3); if(row.hidden){ (meta.hrows=meta.hrows||[]).push(rn-1); } });
    if(Object.keys(rowh).length) meta.rowh = rowh;
    const v0 = (ws.views||[])[0]; if(v0 && v0.state==="frozen" && (v0.xSplit||v0.ySplit)) meta.freeze = {xSplit:v0.xSplit||0, ySplit:v0.ySplit||0, startRow:v0.ySplit||0, startColumn:v0.xSplit||0};
    const merges = []; const mm = (ws.model && ws.model.merges) || [];
    mm.forEach(a=>{ const m = /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/.exec(a); if(!m) return; const cn=s=>s.split("").reduce((n,ch)=>n*26+ch.charCodeAt(0)-64,0)-1;
      merges.push({startRow:Number(m[2])-1,endRow:Number(m[4])-1,startColumn:cn(m[1]),endColumn:cn(m[3])}); });
    if(merges.length) meta.merges = merges;
    tabs[id] = {meta, cells}; idx++;
  });
  if(!idx) throw new Error("ບໍ່ພົບແຜ່ນງານໃນໄຟລ໌");
  return tabs;
}
function univerStyleToXl(s, cellObj){
  const o = {};
  if(!s) return o;
  const font = {};
  if(s.bl) font.bold = true; if(s.it) font.italic = true; if(s.ul && s.ul.s) font.underline = true; if(s.st && s.st.s) font.strike = true;
  if(s.fs) font.size = s.fs; if(s.ff) font.name = s.ff; if(s.cl && s.cl.rgb) font.color = {argb:"FF"+s.cl.rgb.replace("#","").toUpperCase()};
  if(Object.keys(font).length) o.font = font;
  if(s.bg && s.bg.rgb) o.fill = {type:"pattern",pattern:"solid",fgColor:{argb:"FF"+s.bg.rgb.replace("#","").toUpperCase()}};
  const al = {}; if(s.ht) al.horizontal = {1:"left",2:"center",3:"right"}[s.ht]; if(s.vt) al.vertical = {1:"top",2:"middle",3:"bottom"}[s.vt]; if(s.tb===3) al.wrapText = true;
  if(Object.keys(al).length) o.alignment = al;
  if(s.bd){ const b = {}; [["t","top"],["b","bottom"],["l","left"],["r","right"]].forEach(([u,k])=>{ const e=s.bd[u]; if(e && e.s){ b[k] = {style: BSTYLE_R[e.s]||"thin", color:{argb:"FF"+((e.cl&&e.cl.rgb)||"#000000").replace("#","").toUpperCase()}}; } }); if(Object.keys(b).length) o.border = b; }
  if(s.n && s.n.pattern) o.numFmt = s.n.pattern;
  return o;
}
async function tabsToXlsx(tabs){
  const wb = new ExcelJS.Workbook(); wb.creator = (S.me && S.me.name) || "Marketing Studio";
  const ids = Object.keys(tabs).sort((a,b)=>(tabs[a].meta.order||0)-(tabs[b].meta.order||0));
  ids.forEach(id=>{
    const {meta, cells} = tabs[id]; const ws = wb.addWorksheet((meta.name||"Sheet").replace(/[\\/?*\[\]:]/g,"_").slice(0,31));
    for(const c in (meta.colw||{})) ws.getColumn(Number(c)+1).width = Math.max(1,(meta.colw[c]-5)/7);
    for(const r in (meta.rowh||{})) ws.getRow(Number(r)+1).height = meta.rowh[r]*0.75;
    (meta.hcols||[]).forEach(c=>{ ws.getColumn(c+1).hidden = true; }); (meta.hrows||[]).forEach(r=>{ ws.getRow(r+1).hidden = true; });
    for(const key in cells){
      const [r,c] = key.split(",").map(Number); const o = cells[key]; const cell = ws.getCell(r+1, c+1);
      if(o.f) cell.value = {formula: o.f.replace(/^=/,""), result: o.v};
      else if(o.t===3) cell.value = !!o.v; else if(o.v!==undefined) cell.value = o.v;
      const st = univerStyleToXl(o.s, o); for(const k in st) cell[k] = st[k];
    }
    (meta.merges||[]).forEach(m=>{ try{ ws.mergeCells(m.startRow+1, m.startColumn+1, m.endRow+1, m.endColumn+1); }catch(e){} });
    if(meta.freeze) ws.views = [{state:"frozen", xSplit:meta.freeze.xSplit||0, ySplit:meta.freeze.ySplit||0}];
  });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
